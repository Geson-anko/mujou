default_language_version:
  python: python3.14

repos:
  # Basic file checks and formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: check-yaml
        # mkdocs.yml uses Python tags (!!python/name:...), as Material recommends.
        # --unsafe only checks the syntax instead of loading the tags.
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: debug-statements
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  # To ensure the lockfile is up-to-date
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.24
    hooks:
      - id: uv-lock

  # Python code linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  # Rust formatting and linting (uses the local toolchain)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: ^(Cargo\.(toml|lock)|rust-toolchain\.toml|crates/)
        pass_filenames: false

  # Python syntax upgrading
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py314-plus]

  # Markdown formatting
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.18
    hooks:
      - id: mdformat
        args: ["--number"]
        # memory/ uses [[wiki-links]] between memories, which mdformat escapes
        # into \[\[...\]\] and thereby breaks. .claude/ skills and specs/ contain
        # LaTeX whose escaping mdformat would also alter. docs/ has its own entry below.
        exclude: ^(memory/|\.claude/|specs/|docs/)
        additional_dependencies:
          - mdformat-gfm
          - mdformat-tables
          - mdformat_frontmatter

  # Markdown formatting of the user documentation (docs/). It uses the MkDocs
  # syntax (admonitions, content tabs, snippets, mkdocstrings), which plain mdformat
  # turns into code blocks. mdformat-mkdocs needs a newer mdformat than the entry
  # above.
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: mdformat (docs)
        args: ["--number"]
        files: ^docs/
        additional_dependencies:
          - mdformat-mkdocs==5.3.0

  # Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          - --skip=uv.lock
          # "ALM" = Augmented Lagrangian Method; "crate" is a Rust package.
          - --ignore-words-list=alm,crate

  # Additional Python checks
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-log-warn
      - id: python-use-type-annotations

  # The type stub of the native extension, generated from the Rust sources.
  # Fails (as a hook that changed files) when the committed stub is stale.
  - repo: local
    hooks:
      - id: mujou-stub
        name: just stub (src/mujou/_core/_native.pyi)
        entry: just stub
        language: system
        files: ^(Cargo\.(toml|lock)|crates/|pyproject\.toml$|src/mujou/_core/_native\.pyi$)
        pass_filenames: false
