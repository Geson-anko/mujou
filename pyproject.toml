[project]
name = "mujou"
dynamic = ["version"]
description = "Asynchronous Distributed Deep Learning Library for Continuous Learning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.14.1",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/Geson-anko/mujou"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

# The version comes from [workspace.package] in Cargo.toml.
[tool.maturin]
manifest-path = "crates/mujou-python/Cargo.toml"
python-source = "src"
module-name = "mujou._core._native"

# Rebuild the extension on `uv sync` / `uv run` when the Rust sources change.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocs-static-i18n>=1.3.1",
    "mkdocstrings[python]>=1.0.7",
    "pre-commit>=4.2.0",
    "pyright>=1.1.400",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.8.4",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = "tests/"
addopts = [
    "--color=yes",
    "--durations=10",
    "--strict-markers",
    "--doctest-modules",
]
markers = [
    "slow: long-running convergence / training checks (deselect with -m 'not slow')",
    "cuda(n=1): needs n CUDA devices; skipped otherwise",
]

[tool.coverage.run]
source = ["src/mujou"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pyright]
pythonVersion = "3.14"
strict = ["./src/"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    ".claude/worktrees/",
]
reportImplicitOverride = true
reportPrivateUsage = "warning"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    ".claude/worktrees",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E203", # Whitespace before ':'
    "E501", # Line too long (formatter owns this)
    "E741", # Ambiguous variable name (math notation: l, I)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# On Linux, take torch from the CPU-only index: mujou's core does not use the GPU,
# and the default index pulls the CUDA wheels (several GB).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
