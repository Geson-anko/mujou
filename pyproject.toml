[project]
name = "mujou"
dynamic = ["version"]
description = "Asynchronous Distributed Deep Learning Library for Continuous Learning, trained with PC-ALM instead of backpropagation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

# The version comes from [workspace.package] in Cargo.toml.
[tool.maturin]
manifest-path = "crates/mujou-python/Cargo.toml"
python-source = "src"
module-name = "mujou._core"
features = ["pyo3/extension-module"]

# Rebuild the extension on `uv sync` / `uv run` when the Rust sources change.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pyright>=1.1.400",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.4",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = "tests/"
addopts = [
    "--color=yes",
    "--durations=10",
    "--strict-markers",
    "--doctest-modules",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: long-running convergence / training checks (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["src/mujou"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pyright]
pythonVersion = "3.14"
strict = ["./src/"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    ".claude/worktrees/",
]
reportImplicitOverride = true
reportPrivateUsage = "warning"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    ".claude/worktrees",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E203", # Whitespace before ':'
    "E501", # Line too long (formatter owns this)
    "E741", # Ambiguous variable name (math notation: l, I)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
