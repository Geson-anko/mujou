site_name: Mujou
site_description: Documentation for Mujou - Asynchronous Distributed Deep Learning Library for Continuous Learning
site_url: https://geson-anko.github.io/mujou/
repo_url: https://github.com/Geson-anko/mujou
repo_name: Geson-anko/mujou

copyright: "Images: a new work based on Yoichi Ochiai's <em>Liquid Universe</em>"

# User documentation. The design specifications for developers are in specs/.
docs_dir: docs
# Rebuild on changes to the docstrings and to the included examples too.
watch:
  - src
  - examples

theme:
  name: material
  # Adds the Open Graph and Twitter Card tags (link previews).
  custom_dir: overrides
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # The image of Mujou: a new work based on Yoichi Ochiai's Liquid Universe. The
  # credit is in copyright (the footer of every page) and under the image on the home
  # page.
  logo: assets/icon.jpg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  # Grid cards on the landing pages: <div class="grid cards" markdown>.
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Material renders <pre class="mermaid"> blocks as diagrams.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Math in $...$ and $$...$$, rendered by MathJax (extra_javascript).
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Pages include the programs of examples/ with --8<-- "examples/<file>.py"
  # (or a marked section, "examples/<file>.py:<section>"), so that the code on the
  # site is the code in the repository.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      # A section marked inside a function is shown without its indentation.
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - footnotes
  - toc:
      permalink: true
      # The default slugify drops non-ASCII characters, so Japanese headings got
      # ids like _1 and links to them broke. This one keeps Unicode.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search
  # One folder per language (docs/en, docs/ja). A page missing from docs/ja falls
  # back to the English one, so the API reference (English docstrings) is written
  # only once.
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          copyright: "画像: 落合陽一「リキッドユニバース」をもとに新たに制作"
          site_description: 連続的継続学習のための非同期分散型深層学習フレームワーク
          nav_translations:
            Home: ホーム
            Installation: インストール
            How Mujou Works: Mujou の仕組み
            Tutorial: チュートリアル
            1. Run a Network: 1. ネットワークを走らせる
            2. Write a Node: 2. ノードを書く
            3. Test a Node: 3. ノードをテストする
            4. Learn in a Node: 4. ノードの中で学習する
            5. Learn with PC-ALM: 5. PC-ALM で学習する
            6. Save and Resume: 6. 保存と再開
            Topics: トピック
            Ports and Channels: Port と Channel
            Groups: Group
            Host I/O: ホストの入出力
            Time: 時間
            Threads and Devices: スレッドとデバイス
            Errors and Shutdown: 例外と終了
            Update Rules: 更新則
            How mujou.pc Works: mujou.pc の仕組み
            Visualize a Network: ネットワークの可視化
            Examples: サンプル
            API Reference: API リファレンス
            Nodes and Ports: ノードと Port
            Networks: ネットワーク
            Runs: 実行
            Testing: テスト
            Types: 型
            Visualization: 可視化
            Changelog: 変更履歴
  # The API pages are built once per language, so mujou.Node has a page in each:
  # a reference goes to the one of its own language.
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            # The typed overloads of the ports repeat each signature with the private
            # spec default; the implementation's signature is enough.
            show_overloads: false
            show_submodules: false
            separate_signature: true
            line_length: 88
            show_signature_annotations: true
            show_root_heading: true
            merge_init_into_class: true
            docstring_section_style: spacy
            members_order: source
            inherited_members: true
            # List every public member, also one without a docstring of its own.
            show_if_no_docstring: true
            # Hide private names and the dunders that exceptions inherit.
            filters: ["!^_"]

# Anchors of links are checked against heading ids; hooks/anchors.py makes the
# percent-encoded anchors that mdformat writes match too.
hooks:
  - hooks/anchors.py
validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Installation: install.md
  - How Mujou Works: concepts.md
  - Tutorial:
      - 1. Run a Network: tutorial/1-run.md
      - 2. Write a Node: tutorial/2-node.md
      - 3. Test a Node: tutorial/3-test.md
      - 4. Learn in a Node: tutorial/4-learn-in-a-node.md
      - 5. Learn with PC-ALM: tutorial/5-learn-with-pc.md
      - 6. Save and Resume: tutorial/6-save-and-resume.md
  - Topics:
      - Ports and Channels: topics/ports.md
      - Groups: topics/groups.md
      - Host I/O: topics/host-io.md
      - Time: topics/time.md
      - Threads and Devices: topics/threads-and-devices.md
      - Errors and Shutdown: topics/errors.md
      - Update Rules: topics/update-rules.md
      - How mujou.pc Works: topics/pc-concepts.md
      - PC-ALM: topics/pc.md
      - Visualize a Network: topics/visualize.md
  - Examples: examples.md
  - API Reference:
      - Nodes and Ports: api/node-and-ports.md
      - Networks: api/network.md
      - Runs: api/run.md
      - Time: api/time.md
      - Testing: api/testing.md
      - Types: api/types.md
      - PC-ALM: api/pc.md
      - Visualization: api/viz.md
  - Changelog: changelog.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  # Versioned docs via mike (deployed by .github/workflows/docs.yml): a version menu
  # in the header. "dev" follows main, "latest" the newest stable release.
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Geson-anko/mujou
