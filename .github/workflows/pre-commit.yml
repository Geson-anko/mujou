name: Format & Lint (pre-commit)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run_pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The action caches ~/.cache/pre-commit by itself.
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          # Needs the built extension; the test workflow checks the stub instead.
          SKIP: mujou-stub
