name: GPU

# The tests marked `cuda`, on a self-hosted runner with the label `gpu`
# (.github/runner/README.md). It runs on pushes to main and on pull requests, but
# never for a pull request from a fork: that code must not run on the
# self-hosted machine.
on:
  push:
    branches: [main]
    paths: &paths
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/gpu.yml"
  pull_request:
    branches: [main, "release/**"]
    paths: *paths
  workflow_dispatch:

# One runner: a newer push to the same branch replaces the run still waiting or
# running.
concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    name: cuda / 3.14t
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"

      - uses: extractions/setup-just@v4

      # torch comes from PyPI, whose Linux wheels are built with CUDA. The runner
      # keeps uv's cache between runs, but the checkout removes the extension
      # that the cached editable install of mujou put in src/: build it again.
      - name: Install dependencies
        run: uv sync --reinstall-package mujou

      - name: Check that torch sees a CUDA device
        run: uv run --no-sync python -c "import torch; assert torch.cuda.is_available(), 'no CUDA device'; print(torch.__version__, torch.cuda.get_device_name(0))"

      - name: Run the tests marked cuda
        run: uv run --no-sync pytest -m cuda -v
