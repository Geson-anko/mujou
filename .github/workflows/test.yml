name: Test

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".claude/hooks/**"
      - ".claude/scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - ".claude/hooks/**"
      - ".claude/scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/test.yml"

jobs:
  run_tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: uv sync

      - name: Run pytest with coverage
        run: just test
