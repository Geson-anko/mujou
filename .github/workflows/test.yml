name: Test

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - ".claude/hooks/**"
      - ".claude/scripts/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - ".claude/hooks/**"
      - ".claude/scripts/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/test.yml"

jobs:
  run_tests:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.14t", "3.14"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: uv sync

      - name: Run pytest with coverage
        run: just test

      - name: Check that the committed type stub is up to date
        run: just stub && git diff --exit-code src/mujou/_core/_native.pyi
