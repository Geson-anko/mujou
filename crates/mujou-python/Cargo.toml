[package]
name = "mujou-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]
# Test binaries would have to link libpython; test the logic in mujou-core and the
# bindings from pytest instead.
test = false
doctest = false

[dependencies]
mujou-core = { path = "../mujou-core" }
pyo3 = { version = "0.30.1", features = ["experimental-inspect"] }
